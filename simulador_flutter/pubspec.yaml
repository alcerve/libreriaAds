name: simulador_ads
description: Simulador de dispositivo ADS (Beckhoff Automation Device Specification) en Flutter/Dart.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

# Sin dependencias externas: solo SDK. El núcleo (lib/ads y lib/simulator)
# usa únicamente dart:io / dart:typed_data / dart:convert / dart:async.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
